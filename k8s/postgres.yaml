apiVersion: v1
kind: Service
metadata:
  name: gym-db
spec:
  clusterIP: None          # headless: only reachable inside the cluster
  selector:
    app: gym-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gym-db
spec:
  serviceName: gym-db
  replicas: 1
  selector:
    matchLabels:
      app: gym-db
  template:
    metadata:
      labels:
        app: gym-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: gym
            - name: POSTGRES_DB
              value: gym
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gym-monitor
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gym", "-d", "gym"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
